<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビジネスキャリア検定3級 企業法務 過去問クイズ</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card-bg: #ffffff;
    --accent: #2f5fa3;
    --accent-dark: #1e3f73;
    --text: #22303f;
    --sub: #6b7a8d;
    --border: #dde3ea;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.7;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 16px 80px;
  }
  h1 {
    font-size: 1.3rem;
    color: var(--accent-dark);
    margin-bottom: 6px;
  }
  .sub {
    color: var(--sub);
    font-size: 0.9rem;
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }
  a.part {
    display: block;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 18px 16px;
    text-decoration: none;
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    transition: border-color 0.15s, transform 0.15s;
  }
  a.part:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .part-num {
    font-weight: bold;
    color: var(--accent);
    font-size: 1.05rem;
    margin-bottom: 4px;
  }
  .part-range {
    font-size: 0.85rem;
    color: var(--sub);
  }
  .all-link {
    display: block;
    margin-top: 28px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--sub);
  }
  .all-link a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>企業法務3級 過去問クイズ</h1>
  <div class="sub">全100問を10問ずつ、10回に分けて挑戦できます。クリックで回答→即時フィードバック→解説表示、タイマーなしで自分のペースで進められます。</div>
  <div class="grid">
    <a class="part" href="part1.html"><div class="part-num">第1回</div><div class="part-range">問題 1〜10</div></a>
    <a class="part" href="part2.html"><div class="part-num">第2回</div><div class="part-range">問題 11〜20</div></a>
    <a class="part" href="part3.html"><div class="part-num">第3回</div><div class="part-range">問題 21〜30</div></a>
    <a class="part" href="part4.html"><div class="part-num">第4回</div><div class="part-range">問題 31〜40</div></a>
    <a class="part" href="part5.html"><div class="part-num">第5回</div><div class="part-range">問題 41〜50</div></a>
    <a class="part" href="part6.html"><div class="part-num">第6回</div><div class="part-range">問題 51〜60</div></a>
    <a class="part" href="part7.html"><div class="part-num">第7回</div><div class="part-range">問題 61〜70</div></a>
    <a class="part" href="part8.html"><div class="part-num">第8回</div><div class="part-range">問題 71〜80</div></a>
    <a class="part" href="part9.html"><div class="part-num">第9回</div><div class="part-range">問題 81〜90</div></a>
    <a class="part" href="part10.html"><div class="part-num">第10回</div><div class="part-range">問題 91〜100</div></a>
  </div>
  <div class="all-link"><a href="all.html">まとめて全100問で挑戦する →</a></div>
</div>
</body>
</html>
