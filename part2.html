const CHOICE_LABELS = ["ア", "イ", "ウ", "エ"];

let idx = 0;
let score = 0;
let answered = false;

const counterEl = document.getElementById("counter");
const scoreNumEl = document.getElementById("scoreNum");
const progressBar = document.getElementById("progressBar");
const breadcrumbEl = document.getElementById("breadcrumb");
const qnumEl = document.getElementById("qnum");
const qsourceEl = document.getElementById("qsource");
const qtextEl = document.getElementById("qtext");
const choicesEl = document.getElementById("choices");
const resultBanner = document.getElementById("resultBanner");
const explainEl = document.getElementById("explain");
const pointTextEl = document.getElementById("pointText");
const explainChoicesEl = document.getElementById("explainChoices");
const nextBtn = document.getElementById("nextBtn");
const quizCard = document.getElementById("quizCard");
const doneCard = document.getElementById("doneCard");
const finalScoreEl = document.getElementById("finalScore");
const restartBtn = document.getElementById("restartBtn");

function renderQuestion() {
  answered = false;
  const item = DATA[idx];
  counterEl.textContent = (idx + 1) + " / " + DATA.length;
  progressBar.style.width = (idx / DATA.length * 100) + "%";
  breadcrumbEl.textContent = item.cat;
  qnumEl.textContent = "問題 " + item.num;
  qsourceEl.textContent = item.source;
  qtextEl.textContent = item.q;

  choicesEl.innerHTML = "";
  item.choices.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = '<span class="label">' + CHOICE_LABELS[i] + '.</span>' + text;
    btn.addEventListener("click", () => selectChoice(i));
    choicesEl.appendChild(btn);
  });

  resultBanner.className = "result-banner";
  resultBanner.textContent = "";
  explainEl.classList.remove("show");
  nextBtn.classList.remove("show");
}

function selectChoice(i) {
  if (answered) return;
  answered = true;
  const item = DATA[idx];
  const buttons = choicesEl.querySelectorAll(".choice");
  buttons.forEach((b) => b.classList.add("disabled"));

  const isCorrect = i === item.correct;
  if (isCorrect) {
    score++;
    scoreNumEl.textContent = score;
    buttons[i].classList.add("correct");
    resultBanner.textContent = "○ 正解！";
    resultBanner.className = "result-banner show correct";
  } else {
    buttons[i].classList.add("wrong-selected");
    buttons[item.correct].classList.add("correct");
    resultBanner.textContent = "✕ 不正解（正解：" + CHOICE_LABELS[item.correct] + "）";
    resultBanner.className = "result-banner show wrong";
  }

  pointTextEl.textContent = item.point;
  explainChoicesEl.innerHTML = "";
  item.explains.forEach((text, ei) => {
    const div = document.createElement("div");
    div.className = "explain-choice " + (ei === item.correct ? "is-correct" : "is-incorrect");
    div.innerHTML = '<span class="label">' + CHOICE_LABELS[ei] + '.</span>' + text;
    explainChoicesEl.appendChild(div);
  });
  explainEl.classList.add("show");
  nextBtn.classList.add("show");
}

nextBtn.addEventListener("click", () => {
  idx++;
  if (idx >= DATA.length) {
    showDone();
  } else {
    renderQuestion();
  }
});

function showDone() {
  quizCard.style.display = "none";
  doneCard.classList.add("show");
  progressBar.style.width = "100%";
  finalScoreEl.innerHTML = '<div style="font-size:1.3rem;">' + score + ' / ' + DATA.length + ' 問正解</div>';
}

restartBtn.addEventListener("click", () => {
  idx = 0;
  score = 0;
  scoreNumEl.textContent = "0";
  quizCard.style.display = "block";
  doneCard.classList.remove("show");
  renderQuestion();
});

renderQuestion();
</script>
